name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # The Go suite covers none of the frontend, and the scan screen's real bugs
  # have all been decisions rather than rendering — which folder of a game
  # counts as the save, whether an already-tracked folder may be adopted into
  # another. Those live in plain modules now so they can be checked in
  # milliseconds. Its own job because it needs Node and nothing else, and
  # finishing in seconds it should not wait behind a 30-minute race run.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cmd/opensave-app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      # A frontend that does not compile is a broken build whatever the unit
      # tests say.
      - run: npm run build

  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      # cmd/opensave-app embeds frontend/dist (built by wails); stub it so
      # vet/test can compile the package without a frontend toolchain.
      - name: Stub embedded frontend assets
        shell: bash
        run: mkdir -p cmd/opensave-app/frontend/dist && echo stub > cmd/opensave-app/frontend/dist/.stub
      - name: Vet
        run: go vet ./...
      # -p 2 and a longer timeout because the e2e package now starts real
      # daemons, binds real ports and spawns the CLI as a subprocess. Run at
      # full package parallelism alongside everything else it saturates the
      # runner, and the failures that produces look like real regressions:
      # build steps failing in packages the change never touched. Reproduced
      # locally — the same suite passes with -p 1 and fails without it.
      - name: Test (race detector)
        run: go test ./... -race -p 2 -timeout 1800s
